# Pings /health on a schedule: keeps the HF Space awake and (because /health runs a
# Qdrant count) counts as activity for Qdrant Cloud's 7-day idle policy.
name: keepalive
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          SPACE_URL: ${{ vars.SPACE_URL }}
        run: |
          test -n "$SPACE_URL" || { echo "Set repo variable SPACE_URL"; exit 1; }
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 120 "$SPACE_URL/health"
