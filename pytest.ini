[pytest]
testpaths = tests
norecursedirs = eval_gate
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    slow: marks tests that require real models or Ollama (deselect with -m "not slow")
    integration: marks tests that hit a real Qdrant collection
    eval: DeepEval regression gate (needs GROQ_API_KEY + a reviewed golden set)
