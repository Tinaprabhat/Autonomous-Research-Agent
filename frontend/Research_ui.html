<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Research Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0d0f0f; --surface:#131616; --border:#1f2424; --border2:#2a3030;
    --text:#e8eded; --muted:#7d8c8c; --accent:#4fffb0; --accent2:#ff6b4a;
    --warn:#ffcc4a; --tag-bg:#1a2420;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;background-size:40px 40px;
    background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px)}
  header{position:relative;z-index:1;border-bottom:1px solid var(--border2);padding:18px 40px;display:flex;align-items:center;justify-content:space-between;background:rgba(13,15,15,.9)}
  .logo{font-family:'DM Serif Display',serif;font-size:22px}
  .logo em{color:var(--accent);font-style:italic}
  #status-pill{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}
  main{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:44px 20px 80px}
  h1{font-family:'DM Serif Display',serif;font-weight:400;font-size:36px;margin-bottom:6px}
  .sub{color:var(--muted);margin-bottom:26px}
  .box{background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:14px}
  textarea{width:100%;background:transparent;border:0;outline:0;color:var(--text);font:400 16px 'DM Sans',sans-serif;resize:vertical;min-height:54px}
  .row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:10px}
  button{font:500 14px 'DM Sans',sans-serif;cursor:pointer;border-radius:8px;border:1px solid var(--border2);background:var(--tag-bg);color:var(--text);padding:8px 14px}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:#04120b;border-color:var(--accent)}
  button:disabled{opacity:.5;cursor:default}
  details.filters{margin-top:10px;color:var(--muted);font-size:13px}
  details.filters summary{cursor:pointer;user-select:none}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
  .fgrid label{display:flex;flex-direction:column;gap:4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  .fgrid input,.fgrid select{background:var(--bg);border:1px solid var(--border2);border-radius:6px;color:var(--text);padding:7px;font:13px 'DM Sans',sans-serif}
  .examples{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .chip{font-size:12px;color:var(--muted);border:1px solid var(--border2);border-radius:999px;padding:5px 12px;cursor:pointer;background:var(--tag-bg)}
  .chip:hover{color:var(--accent);border-color:var(--accent)}
  .banner{margin-top:22px;padding:12px 14px;border-radius:8px;border:1px solid;font-size:14px}
  .banner.warn{border-color:var(--warn);color:var(--warn);background:rgba(255,204,74,.07)}
  .banner.err{border-color:var(--accent2);color:var(--accent2);background:rgba(255,107,74,.07)}
  .banner.info{border-color:var(--border2);color:var(--muted)}
  #answer-card{margin-top:22px;display:none}
  .label{font:500 11px 'JetBrains Mono',monospace;letter-spacing:.1em;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
  #answer{font-size:17px;line-height:1.7;white-space:pre-wrap}
  #answer.draft{color:var(--muted)}
  a.cite{color:var(--accent);text-decoration:none;font:500 12px 'JetBrains Mono',monospace;vertical-align:super;cursor:pointer;padding:0 1px}
  a.cite:hover{text-decoration:underline}
  .meta{margin-top:12px;font:11px 'JetBrains Mono',monospace;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
  .fb{display:flex;gap:8px;margin-top:14px;align-items:center}
  .fb small{color:var(--muted)}
  #sources{margin-top:26px;display:grid;gap:10px}
  .src{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;scroll-margin-top:20px}
  .src.cited{border-color:var(--border2);border-left:3px solid var(--accent)}
  .src.flash{animation:flash 1.2s}
  @keyframes flash{from{background:#1d3a2e}to{background:var(--surface)}}
  .src h3{font:500 14px 'DM Sans',sans-serif;display:flex;gap:8px;align-items:baseline}
  .src .n{font:500 12px 'JetBrains Mono',monospace;color:var(--accent)}
  .src .where{font-size:12px;color:var(--muted);margin:3px 0 6px}
  .src p{font-size:13px;color:#b8c4c4;line-height:1.5}
  .links{display:flex;gap:12px;margin-top:8px;font-size:12px;align-items:center}
  .links a{color:var(--accent);text-decoration:none}
  .links a:hover{text-decoration:underline}
  .links button{font-size:11px;padding:3px 8px;margin-left:auto}
  .dots::after{content:'';animation:d 1.2s steps(4) infinite}
  @keyframes d{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
  @media(max-width:600px){header{padding:14px 16px}h1{font-size:28px}}
</style>
</head>
<body>
<header>
  <div class="logo">Research <em>Agent</em></div>
  <div id="status-pill">connecting…</div>
</header>

<main>
  <h1>Ask the literature.</h1>
  <p class="sub">Answers are grounded in indexed arXiv papers. Every claim is checked against its cited passage; unsupported claims are dropped.</p>

  <div class="box">
    <textarea id="q" maxlength="500" placeholder="e.g. How does MAML adapt to a new task?" aria-label="Question"></textarea>
    <details class="filters">
      <summary>Filters</summary>
      <div class="fgrid">
        <label>Category <select id="f-category"><option value="">Any</option></select></label>
        <label>Section <select id="f-section"><option value="">Any</option></select></label>
        <label>Author <input id="f-author" placeholder="exact name"/></label>
        <label>Published from <input id="f-from" type="date"/></label>
        <label>Published to <input id="f-to" type="date"/></label>
      </div>
    </details>
    <div class="row">
      <span style="font-size:12px;color:var(--muted)">Enter to search · Shift+Enter for newline</span>
      <button id="go" class="primary">Search</button>
    </div>
  </div>

  <div class="examples" id="examples"></div>

  <div id="banner"></div>

  <div id="answer-card" class="box">
    <div class="label" id="answer-label">Answer</div>
    <div id="answer"></div>
    <div class="meta" id="meta"></div>
    <div class="fb" id="fb" style="display:none">
      <button data-k="thumbs_up" title="Helpful">👍</button>
      <button data-k="thumbs_down" title="Not helpful">👎</button>
      <small id="fb-note"></small>
    </div>
  </div>

  <div id="sources"></div>
</main>

<script>
const API = location.protocol === 'file:' ? 'http://localhost:8000' : '';
// API key (only needed when the server runs with API_KEYS set). Kept in this browser's localStorage.
function apiKey() { try { return localStorage.getItem('ara_api_key') || ''; } catch (e) { return ''; } }
function askKey() {
  const k = window.prompt('This server requires an API key. Paste it here:');
  if (k) { try { localStorage.setItem('ara_api_key', k.trim()); } catch (e) {} }
  return !!k;
}
function authHeaders(extra) { const h = Object.assign({}, extra); const k = apiKey(); if (k) h['X-API-Key'] = k; return h; }
const $ = id => document.getElementById(id);
const EXAMPLES = ['What is meta-learning?', 'How does MAML differ from metric-based few-shot methods?',
                  'How does retrieval-augmented generation work?'];
let state = { query: '', answer: '', busy: false };

EXAMPLES.forEach(t => {
  const c = document.createElement('span'); c.className = 'chip'; c.textContent = t;
  c.onclick = () => { $('q').value = t; search(); };
  $('examples').appendChild(c);
});

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function banner(kind, msg) {
  const b = $('banner'); b.textContent = '';
  if (msg) { const d = el('div', 'banner ' + kind, msg); b.appendChild(d); }
}

// Render answer text, turning [N] into links to the source cards. Text nodes only (no innerHTML).
function renderAnswer(text, cites) {
  const box = $('answer'); box.textContent = '';
  const re = /\[(\d+)\]/g; let last = 0, m;
  while ((m = re.exec(text))) {
    box.appendChild(document.createTextNode(text.slice(last, m.index)));
    const n = +m[1];
    if (cites && cites.some(c => c.n === n)) {
      const a = el('a', 'cite', '[' + n + ']'); a.title = 'Jump to source ' + n;
      a.onclick = () => jumpTo(n); box.appendChild(a);
    } else box.appendChild(document.createTextNode(m[0]));
    last = m.index + m[0].length;
  }
  box.appendChild(document.createTextNode(text.slice(last)));
}
function jumpTo(n) {
  const s = $('src-' + n); if (!s) return;
  s.scrollIntoView({ behavior: 'smooth', block: 'center' });
  s.classList.remove('flash'); void s.offsetWidth; s.classList.add('flash');
}

function renderSources(cites) {
  const box = $('sources'); box.textContent = '';
  if (!cites || !cites.length) return;
  box.appendChild(el('div', 'label', 'Sources'));
  cites.forEach(c => {
    const s = el('div', 'src' + (c.cited ? ' cited' : '')); s.id = 'src-' + c.n;
    const h = el('h3'); h.appendChild(el('span', 'n', '[' + c.n + ']')); h.appendChild(el('span', '', c.title || 'Untitled'));
    s.appendChild(h);
    const bits = [];
    if (c.authors && c.authors.length) bits.push(c.authors.slice(0, 3).join(', ') + (c.authors.length > 3 ? ' et al.' : ''));
    if (c.published_date) bits.push(c.published_date.slice(0, 10));
    if (c.section && c.section !== 'Unknown') bits.push(c.section);
    if (c.page) bits.push('p.' + c.page);
    s.appendChild(el('div', 'where', bits.join(' · ')));
    s.appendChild(el('p', '', c.text));
    const l = el('div', 'links');
    if (c.url) { const a = el('a', '', 'arXiv:' + c.arxiv_id + ' ↗'); a.href = c.url; a.target = '_blank'; a.rel = 'noopener'; l.appendChild(a); }
    if (c.pdf_url) { const a = el('a', '', 'PDF' + (c.page ? ' p.' + c.page : '') + ' ↗'); a.href = c.pdf_url; a.target = '_blank'; a.rel = 'noopener'; l.appendChild(a); }
    const w = el('button', '', 'Wrong citation'); w.onclick = () => { feedback('wrong_citation', c.n); w.textContent = 'Reported'; w.disabled = true; };
    l.appendChild(w); s.appendChild(l); box.appendChild(s);
  });
}

function filters() {
  const f = {};
  [['category', 'f-category'], ['section', 'f-section'], ['author', 'f-author'],
   ['date_from', 'f-from'], ['date_to', 'f-to']].forEach(([k, id]) => { const v = $(id).value.trim(); if (v) f[k] = v; });
  return Object.keys(f).length ? f : null;
}

function showFinal(r) {
  $('answer').classList.remove('draft');
  $('answer-label').textContent = r.status === 'ok' ? 'Verified answer' : (r.status === 'low_confidence' || r.status === 'unverified') ? 'Unverified answer' : 'Answer';
  const cls = { rejected: 'err', blocked: 'err', unverified: 'warn', low_confidence: 'warn', abstained: 'info' }[r.status];
  banner(cls || '', r.status === 'abstained' ? '' : (r.warning || ''));
  renderAnswer(r.answer || '', r.citations);
  renderSources(r.citations);
  const m = [];
  if (r.status === 'ok') m.push('faithfulness ' + r.faithfulness_score);
  if (r.status === 'low_confidence') m.push(r.dropped_sentences.length + ' claim(s) could not be verified');
  if (r.status === 'ok' && r.dropped_sentences && r.dropped_sentences.length) m.push(r.dropped_sentences.length + ' unsupported claim(s) removed');
  m.push(r.latency_ms + ' ms'); if (r.model) m.push(r.model + (r.provider ? ' via ' + r.provider : ''));
  $('meta').textContent = m.join(' · ');
  state.answer = r.answer || '';
  $('fb').style.display = 'flex';
}

async function search() {
  const query = $('q').value.trim();
  if (!query || state.busy) return;
  state = { query, answer: '', busy: true };
  $('go').disabled = true; $('go').textContent = 'Searching…';
  $('answer-card').style.display = 'block'; $('fb').style.display = 'none'; $('fb-note').textContent = '';
  $('answer').className = 'draft'; $('answer').textContent = ''; $('meta').textContent = '';
  $('answer-label').innerHTML = ''; $('answer-label').appendChild(document.createTextNode('Drafting (unverified)'));
  $('answer-label').appendChild(el('span', 'dots'));
  $('sources').textContent = ''; banner('', '');
  let draft = '';
  try {
    const res = await fetch(API + '/query/stream', {
      method: 'POST', headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ query, top_k: 5, filters: filters() }) });
    if (res.status === 401) { askKey(); throw new Error('API key required or invalid — enter it and search again.'); }
    if (res.status === 429) { let d = ''; try { d = (await res.json()).detail; } catch (e) {} throw new Error(d || 'Too many requests — please wait a minute.'); }
    if (!res.ok) { let d = ''; try { d = (await res.json()).detail; } catch (e) {} throw new Error(d && typeof d === 'string' ? d : 'Request failed (' + res.status + ')'); }
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i; while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
        if (!line.startsWith('data:')) continue;
        const ev = JSON.parse(line.slice(5));
        if (ev.event === 'sources') renderSources(ev.citations);
        else if (ev.event === 'token') { draft += ev.text; $('answer').textContent = draft; }
        else if (ev.event === 'retry') { draft = ''; $('answer').textContent = ''; }
        else if (ev.event === 'final') showFinal(ev.result);
        else if (ev.event === 'error') throw new Error('The server hit an error. Please try again.');
      }
    }
  } catch (e) {
    banner('err', e.message || 'Something went wrong.');
    $('answer-card').style.display = 'none';
  } finally {
    state.busy = false; $('go').disabled = false; $('go').textContent = 'Search';
  }
}

async function feedback(kind, citation) {
  try {
    await fetch(API + '/feedback', { method: 'POST', headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ query: state.query, answer: state.answer.slice(0, 4000), kind, citation: citation || null }) });
    $('fb-note').textContent = 'Thanks for the feedback.';
  } catch (e) { $('fb-note').textContent = 'Could not send feedback.'; }
}
document.querySelectorAll('#fb button').forEach(b => b.onclick = () => feedback(b.dataset.k));
$('go').onclick = search;
$('q').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); search(); } });

(async function init() {
  try {
    const h = await (await fetch(API + '/health')).json();
    $('status-pill').textContent = h.status === 'ok' ? h.chunks + ' chunks · ' + (h.model || '') : 'loading…';
    const pr = await fetch(API + '/papers', { headers: authHeaders() });
    if (pr.status === 401 && askKey()) return init();
    const p = await pr.json();
    p.categories.forEach(c => $('f-category').appendChild(new Option(c, c)));
    p.sections.forEach(s => $('f-section').appendChild(new Option(s, s)));
  } catch (e) { $('status-pill').textContent = 'offline'; }
})();
</script>
</body>
</html>
